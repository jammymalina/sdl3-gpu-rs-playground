[package]
name = "sdl3-gpu-rs-playground"
version = "0.1.0"
edition = "2024"
description = "A Three.js-style 3D library in Rust, built on SDL3's GPU API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jammymalina/sdl3-gpu-rs-playground"
keywords = ["gamedev", "graphics", "rendering", "sdl3", "gpu"]
categories = ["game-development", "graphics", "rendering::engine"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cast = "0.3.0"
glam = { version = "0.34.1", features = ["approx-05"] }
sdl3 = "0.20.0"
slotmap = "1.1.1"
thiserror = "2.0.21"

[lints.clippy]
pedantic = "deny"
nursery = "deny"

[[example]]
name = "rotating_cube"

[dev-dependencies]
approx = "0.5.1"
